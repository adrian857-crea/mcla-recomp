
name: MCLA Android Native Target Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect native target configuration
        shell: bash
        run: |
          mkdir -p audit-report
          set +e

          {
            echo "=== COMMIT ==="
            git rev-parse HEAD 2>&1

            echo
            echo "=== SUBMODULES ==="
            git submodule status 2>&1

            echo
            echo "=== ROOT CMAKE ==="
            if [ -f CMakeLists.txt ]; then
              sed -n '1,260p' CMakeLists.txt
            else
              echo "Root CMakeLists.txt not found"
            fi

            echo
            echo "=== MAIN CPP ==="
            if [ -f src/main.cpp ]; then
              sed -n '1,200p' src/main.cpp
            else
              echo "src/main.cpp not found"
            fi

            echo
            echo "=== ANDROID MAIN CPP ==="
            if [ -f src/android_main.cpp ]; then
              sed -n '1,240p' src/android_main.cpp
            else
              echo "src/android_main.cpp not found"
            fi

            echo
            echo "=== RE XGLUE TARGET MACROS ==="
            grep -R -n -E \
              'rexglue_setup_target|REX_DEFINE_APP|XE_UI_WINDOWED_APPS_IN_LIBRARY' \
              generated include src third_party/rexglue-sdk \
              --include='*.cmake' \
              --include='CMakeLists.txt' \
              --include='*.h' \
              --include='*.hpp' \
              --include='*.cpp' \
              2>&1

            echo
            echo "=== SDL ACTIVITY ==="
            find third_party/rexglue-sdk \
              -name SDLActivity.java -type f -print 2>&1

            echo
            echo "=== SDL ANDROID GRADLE FILES ==="
            find third_party/rexglue-sdk \
              -path '*/android-project/app/build.gradle' \
              -type f -print 2>&1

          } > audit-report/native-target-details.txt 2>&1

          {
            echo "Audit completed."
            echo "Commit: $(git rev-parse HEAD 2>/dev/null)"
            echo
            echo "Report size:"
            wc -c audit-report/native-target-details.txt
            echo
            echo "Report preview:"
            sed -n '1,100p' audit-report/native-target-details.txt
          } | tee audit-report/summary.txt

          exit 0

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcla-android-native-target-audit
          path: audit-report/
          if-no-files-found: warn
