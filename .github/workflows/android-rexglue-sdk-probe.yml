name: Android ReXGlue SDK compatibility probe

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-sdk-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout MCLA repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "ndk;27.2.12479018" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmake/3.31.6/bin" >> "$GITHUB_PATH"

      - name: Clone pinned ReXGlue SDK
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive --branch v0.10.0 \
            https://github.com/rexglue/rexglue-sdk.git third_party/rexglue-sdk
          test "$(git -C third_party/rexglue-sdk rev-parse HEAD)" = \
            "f5337cdc947ff6d4c4196737e2c807a48f2a1fc2"

      - name: Locate and apply MCLA SDK patch
        shell: bash
        run: |
          set -euxo pipefail
          PATCH_FILE="$GITHUB_WORKSPACE/patches/rexglue-v0.10.0-mcla.patch"
          if [ ! -f "$PATCH_FILE" ]; then
            echo "::error::Missing patch file: $PATCH_FILE"
            echo "Patch files present in the repository checkout:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -path '*/patches/*' -print || true
            echo "The required MCLA SDK patch is absent; the SDK configuration test cannot continue."
            exit 1
          fi
          git -C third_party/rexglue-sdk apply "$PATCH_FILE"

      - name: Inspect the source of the x11-xcb dependency
        shell: bash
        run: |
          set -u
          SDK_DIR="$GITHUB_WORKSPACE/third_party/rexglue-sdk"
          echo "=== SDK revision ==="
          git -C "$SDK_DIR" rev-parse HEAD || true
          echo
          echo "=== src/ui/CMakeLists.txt around the reported failing line ==="
          if [ -f "$SDK_DIR/src/ui/CMakeLists.txt" ]; then
            nl -ba "$SDK_DIR/src/ui/CMakeLists.txt" | sed -n '115,185p'
          else
            echo "File not found: $SDK_DIR/src/ui/CMakeLists.txt"
          fi
          echo
          echo "=== Every x11-xcb / pkg_check_modules reference in SDK CMake files ==="
          grep -RInE --include='CMakeLists.txt' --include='*.cmake' \
            'x11-xcb|pkg_check_modules|ANDROID|CMAKE_SYSTEM_NAME' "$SDK_DIR/src" "$SDK_DIR/cmake" 2>/dev/null \
            | head -n 300 || true
          echo
          echo "=== UI CMake conditionals and related options ==="
          grep -RInE --include='CMakeLists.txt' --include='*.cmake' \
            'if\s*\(|elseif\s*\(|option\(|BUILD_.*UI|ENABLE_.*UI|SDL|X11|WAYLAND' \
            "$SDK_DIR/src/ui" "$SDK_DIR/CMakeLists.txt" 2>/dev/null | head -n 250 || true
          echo
          echo "=== Android toolchain facts ==="
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"
          grep -E '^(CMAKE_SYSTEM_NAME|CMAKE_ANDROID_ARCH_ABI|ANDROID_ABI|ANDROID_PLATFORM):' \
            "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" 2>/dev/null | head -n 30 || true

      - name: Configure SDK for Android arm64 (diagnostic only)
        id: configure
        shell: bash
        run: |
          set +e
          cmake -S third_party/rexglue-sdk -B build/rexglue-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_shared \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_ENABLE_TRACY=OFF \
            --trace-source=third_party/rexglue-sdk/src/ui/CMakeLists.txt \
            --trace-expand \
            2>&1 | tee android-sdk-configure.log

          result=${PIPESTATUS[0]}
          echo "cmake_exit_code=$result" >> "$GITHUB_OUTPUT"
          echo "CMake configuration exit code: $result"
          exit "$result"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-rexglue-sdk-diagnostics
          path: |
            android-sdk-configure.log
            build/rexglue-android-arm64/CMakeCache.txt
          if-no-files-found: warn

      - name: Summarize result
        if: always()
        env:
          CMAKE_EXIT_CODE: ${{ steps.configure.outputs.cmake_exit_code }}
        shell: bash
        run: |
          {
            echo "## Android ReXGlue SDK compatibility probe"
            echo ""
            echo "- CMake exit code: ${CMAKE_EXIT_CODE:-unknown}"
            echo "- This run only investigates SDK configuration; it does not build MCLA or an APK."
            echo "- Game data is not included or uploaded."
            echo "- If configuration fails, inspect the artifact \`android-rexglue-sdk-diagnostics\`."
          } >> "$GITHUB_STEP_SUMMARY"
