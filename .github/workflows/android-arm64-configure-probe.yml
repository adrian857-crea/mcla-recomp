
name: MCLA Android ARM64 Configure Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout MCLA
        uses: actions/checkout@v4

      - name: Checkout ReXGlue SDK
        uses: actions/checkout@v4
        with:
          repository: adrian857-crea/rexglue-sdk
          path: third_party/rexglue-sdk
          submodules: recursive

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          echo "=== SDKMANAGER ==="
          "$SDKMANAGER" --version

          echo "=== INSTALLING PACKAGES ==="
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          test -f "$NDK/build/cmake/android.toolchain.cmake"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Inspect SDK and configure Android ARM64
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p audit-report

          {
            echo "=== SOURCE REVISIONS ==="
            git rev-parse HEAD
            git -C third_party/rexglue-sdk rev-parse HEAD

            echo
            echo "=== SDK SUBMODULES ==="
            git -C third_party/rexglue-sdk submodule status || true

            echo
            echo "=== ANDROID TOOLCHAIN ==="
            echo "${ANDROID_HOME:-ANDROID_HOME missing}"
            find "${ANDROID_HOME:-/nonexistent}/ndk" \
              -maxdepth 2 -name android.toolchain.cmake \
              -print 2>/dev/null || true
          } > audit-report/environment.txt

          NDK="${ANDROID_HOME}/ndk/27.2.12479018"
          TOOLCHAIN="${NDK}/build/cmake/android.toolchain.cmake"

          if [ ! -f "$TOOLCHAIN" ]; then
            sdkmanager "ndk;27.2.12479018"
          fi

          if [ ! -f "$TOOLCHAIN" ]; then
            echo "Android NDK toolchain not found" \
              | tee audit-report/configure-result.txt
            exit 1
          fi

          set +e
          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXSDK_DIR="$GITHUB_WORKSPACE/third_party/rexglue-sdk" \
            -DREXGLUE_BUILD_TESTS=OFF \
            -DREXGLUE_BUILD_TRACY=OFF \
            > audit-report/cmake-configure.log 2>&1

          RESULT=$?
          set -e

          echo "CMAKE_CONFIGURE_EXIT_CODE=$RESULT" \
            | tee audit-report/configure-result.txt

          tail -n 160 audit-report/cmake-configure.log || true

          exit 0

      - name: Upload configuration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcla-android-arm64-configure-probe
          path: audit-report/
          if-no-files-found: warn
