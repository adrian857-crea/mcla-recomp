
name: MCLA Android ARM64 Build Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout MCLA
        uses: actions/checkout@v4

      - name: Download private XEX input
        shell: bash
        env:
          MCLA_ASSETS_TOKEN: ${{ secrets.MCLA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y jq unzip

          test -n "$MCLA_ASSETS_TOKEN" || {
            echo "Secret MCLA_ASSETS_TOKEN is missing."
            exit 1
          }

          API="https://api.github.com/repos/adrian857-crea/mcla-private-assets/releases/tags/android-input-test"

          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MCLA_ASSETS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" -o /tmp/mcla-release.json

          ASSET_ID="$(jq -er \
            '.assets[] | select(.name == "default-xex.zip") | .id' \
            /tmp/mcla-release.json)"

          curl --fail --location --silent --show-error \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer $MCLA_ASSETS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/adrian857-crea/mcla-private-assets/releases/assets/$ASSET_ID" \
            -o /tmp/default-xex.zip

          unzip -l /tmp/default-xex.zip
          mkdir -p /tmp/mcla-xex
          unzip -o /tmp/default-xex.zip -d /tmp/mcla-xex

          XEX_PATH="$(find /tmp/mcla-xex -type f -name default.xex -print -quit)"

          test -n "$XEX_PATH" || {
            echo "default.xex was not found in the ZIP."
            exit 1
          }

          mkdir -p game
          cp "$XEX_PATH" game/default.xex
          test -s game/default.xex
          echo "Private input successfully placed at game/default.xex."
          ls -lh game/default.xex

      - name: Checkout ReXGlue SDK
        uses: actions/checkout@v4
        with:
          repository: adrian857-crea/rexglue-sdk
          path: third_party/rexglue-sdk
          submodules: recursive

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build clang-19 lld-19 \
            pkg-config cmake python3 file libvulkan-dev \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev \
            libjack-jackd2-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev \
            liburing-dev libunwind-dev libx11-xcb-dev

          cmake --version
          ninja --version
          clang-19 --version
          clang++-19 --version

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify C++23 expected support
        shell: bash
        run: |
          set -euxo pipefail

          cat > /tmp/test_expected.cpp <<'EOF'
          #include <expected>
          #include <vector>
          std::expected<std::vector<int>, int> test() {
              return std::vector<int>{1, 2, 3};
          }
          int main() {
              return test().has_value() ? 0 : 1;
          }
          EOF

          g++ -std=c++23 /tmp/test_expected.cpp -o /tmp/test_expected_gcc
          /tmp/test_expected_gcc

          clang++-19 -std=c++23 -stdlib=libstdc++ \
            /tmp/test_expected.cpp -o /tmp/test_expected_clang
          /tmp/test_expected_clang

          echo "CXX23_EXPECTED_TESTS_OK=true"

      - name: Configure host-native ReXGlue code generator
        shell: bash
        run: |
          set -euxo pipefail

          cmake -S third_party/rexglue-sdk \
            -B build-rexglue-host \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-19 \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DREXGLUE_BUILD_TESTS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_USE_VULKAN=ON

          cmake --build build-rexglue-host --target rexglue --parallel 2

          HOST_CODEGEN="$GITHUB_WORKSPACE/third_party/rexglue-sdk/out/linux-amd64/rexglue"
          test -x "$HOST_CODEGEN"
          file "$HOST_CODEGEN"
          echo "REXGLUE_HOST_CODEGEN_EXECUTABLE=$HOST_CODEGEN" >> "$GITHUB_ENV"

      - name: Verify host code generator
        shell: bash
        run: |
          set -euxo pipefail
          test -x "$REXGLUE_HOST_CODEGEN_EXECUTABLE"
          file "$REXGLUE_HOST_CODEGEN_EXECUTABLE"
          "$REXGLUE_HOST_CODEGEN_EXECUTABLE" --help

      - name: Prepare host codegen integration
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("generated/rexglue.cmake")
          content = path.read_text()

          old = "COMMAND $<TARGET_FILE:rex::rexglue> codegen ${CMAKE_CURRENT_SOURCE_DIR}/mcla_manifest.toml"
          new = 'COMMAND "${REXGLUE_HOST_CODEGEN_EXECUTABLE}" codegen ${CMAKE_CURRENT_SOURCE_DIR}/mcla_manifest.toml'

          if old not in content:
              raise SystemExit(
                  "Expected ReXGlue codegen command was not found."
              )

          path.write_text(content.replace(old, new, 1))
          print("Host code generator integration prepared.")
          PY

          grep -n "REXGLUE_HOST_CODEGEN_EXECUTABLE" generated/rexglue.cmake

      - name: Configure Android ARM64
        shell: bash
        run: |
          set -euxo pipefail

          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXSDK_DIR="$GITHUB_WORKSPACE/third_party/rexglue-sdk" \
            -DREXGLUE_HOST_CODEGEN_EXECUTABLE="$REXGLUE_HOST_CODEGEN_EXECUTABLE" \
            -DREXGLUE_BUILD_TESTS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_USE_VULKAN=ON

      - name: Compile MCLA
        id: compile
        shell: bash
        run: |
          mkdir -p build-report
          set -o pipefail

          set +e
          cmake --build build-android \
            --target mcla --parallel 2 \
            2>&1 | tee build-report/compile.log
          RESULT=${PIPESTATUS[0]}
          set -e

          echo "BUILD_EXIT_CODE=$RESULT" | tee build-report/build-result.txt
          exit "$RESULT"

      - name: Record diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build-report
          {
            echo "=== SOURCE REVISION ==="
            git rev-parse HEAD
            echo
            echo "=== HOST CODEGEN ==="
            if [ -n "${REXGLUE_HOST_CODEGEN_EXECUTABLE:-}" ]; then
              echo "$REXGLUE_HOST_CODEGEN_EXECUTABLE"
              file "$REXGLUE_HOST_CODEGEN_EXECUTABLE" || true
            else
              echo "Host code generator was not configured."
            fi
            echo
            echo "=== BUILD RESULT ==="
            if [ -f build-report/build-result.txt ]; then
              cat build-report/build-result.txt
            else
              echo "Compilation did not reach the build step."
            fi
          } > build-report/environment.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcla-android-arm64-build-probe
          path: build-report/
          if-no-files-found: warn
