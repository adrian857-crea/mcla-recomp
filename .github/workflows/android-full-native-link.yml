name: MCLA Android Full Native Link

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-full-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout MCLA
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build git python3 unzip curl jq clang-19

      - name: Download private default.xex
        shell: bash
        env:
          MCLA_ASSETS_TOKEN: ${{ secrets.MCLA_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          test -n "${MCLA_ASSETS_TOKEN:-}" || { echo "Missing MCLA_ASSETS_TOKEN"; exit 1; }
          API="https://api.github.com/repos/adrian857-crea/mcla-private-assets/releases/tags/android-input-test"
          H="$RUNNER_TEMP/mcla-headers"
          J="$RUNNER_TEMP/mcla-release.json"
          Z="$RUNNER_TEMP/default-xex.zip"
          printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\nX-GitHub-Api-Version: 2022-11-28\n' "$MCLA_ASSETS_TOKEN" > "$H"
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL -H @"$H" "$API" -o "$J"
          ID="$(jq -er '.assets[] | select(.name == "default-xex.zip") | .id' "$J")"
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL -H @"$H" -H "Accept: application/octet-stream" "https://api.github.com/repos/adrian857-crea/mcla-private-assets/releases/assets/$ID" -o "$Z"
          mkdir -p "$RUNNER_TEMP/xex" game
          unzip -oq "$Z" -d "$RUNNER_TEMP/xex"
          XEX="$(find "$RUNNER_TEMP/xex" -type f -name default.xex -print -quit)"
          test -n "$XEX" || { echo "default.xex missing from private asset"; exit 1; }
          install -m 600 "$XEX" game/default.xex
          test -s game/default.xex
          rm -f "$H" "$J" "$Z"
          rm -rf "$RUNNER_TEMP/xex"
          echo "Private XEX downloaded; file contents are not printed."

      - name: Checkout ReXGlue SDK
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/adrian857-crea/rexglue-sdk.git third_party/rexglue-sdk
          test -f third_party/rexglue-sdk/thirdparty/sdl3/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java

      - name: Configure host FFmpeg
        run: |
          set -euo pipefail
          cd third_party/rexglue-sdk/thirdparty/FFmpeg
          ./configure --disable-x86asm --disable-programs --disable-doc --disable-network --disable-autodetect --disable-everything --enable-avutil --enable-avcodec --disable-shared --enable-static
          test -f config.h

      - name: Build host ReXGlue code generator
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/third_party/rexglue-sdk"
          cmake -S "$SDK" -B build-rexglue-host -G Ninja -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_BUILD_TYPE=Release -DREXGLUE_USE_VULKAN=ON -DREXGLUE_USE_D3D12=OFF -DREXGLUE_ENABLE_TRACY=OFF -DREXGLUE_BUILD_TESTS=OFF
          cmake --build build-rexglue-host --target rexglue --parallel 2
          test -x "$SDK/out/linux-amd64/rexglue"
          echo "HOST_CODEGEN=$SDK/out/linux-amd64/rexglue" >> "$GITHUB_ENV"

      - name: Generate MCLA C++ sources from private XEX
        run: |
          set -euo pipefail
          "$HOST_CODEGEN" codegen "$GITHUB_WORKSPACE/mcla_manifest.toml"
          test -s generated/default/sources.cmake
          test -s generated/default/mcla_pch.h
          N="$(find generated/default -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) | wc -l)"
          echo "Generated C++ files: $N"
          test "$N" -gt 0
          touch generated/default/codegen.build.stamp

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$RUNNER_TEMP/cmdline-tools"
          curl --http1.1 --retry 5 --retry-all-errors --retry-delay 2 -fSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools"
          mkdir -p "$SDK/cmdline-tools/latest"
          mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Configure Android FFmpeg
        run: |
          set -euo pipefail
          SDK="$GITHUB_WORKSPACE/third_party/rexglue-sdk"
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          T="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd "$SDK/thirdparty/FFmpeg"
          ./configure --arch=aarch64 --cpu=armv8-a --target-os=android --enable-cross-compile --cc="$T/aarch64-linux-android26-clang" --cxx="$T/aarch64-linux-android26-clang++" --ar="$T/llvm-ar" --ranlib="$T/llvm-ranlib" --nm="$T/llvm-nm" --strip="$T/llvm-strip" --disable-x86asm --disable-programs --disable-doc --disable-network --disable-autodetect --disable-everything --enable-avutil --enable-avcodec --disable-shared --enable-static
          test -f config.h

      - name: Patch Android assembly and host codegen
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/third_party/rexglue-sdk/CMakeLists.txt" "$GITHUB_WORKSPACE/generated/rexglue.cmake" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          old = '"<CMAKE_ASM_COMPILER> <DEFINES> <INCLUDES> <FLAGS> -o <OBJECT> -c <SOURCE>"'
          new = '"<CMAKE_ASM_COMPILER> --target=aarch64-linux-android26 <DEFINES> <INCLUDES> <FLAGS> -o <OBJECT> -c <SOURCE>"'
          if old in s: s = s.replace(old, new, 1)
          elif new not in s: raise SystemExit("Android ASM rule not found")
          p.write_text(s)
          p = pathlib.Path(sys.argv[2]); s = p.read_text()
          old = 'COMMAND $<TARGET_FILE:rex::rexglue> codegen ${CMAKE_CURRENT_SOURCE_DIR}/mcla_manifest.toml'
          new = 'COMMAND "${REXGLUE_HOST_CODEGEN_EXECUTABLE}" codegen ${CMAKE_CURRENT_SOURCE_DIR}/mcla_manifest.toml'
          if old in s: s = s.replace(old, new, 1)
          elif new not in s: raise SystemExit("Could not patch host codegen command")
          p.write_text(s)
          PY

      - name: Configure full MCLA Android ARM64 target
        run: |
          set -euo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-android" -G Ninja -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release -DREXSDK_DIR="$GITHUB_WORKSPACE/third_party/rexglue-sdk" -DREXGLUE_HOST_CODEGEN_EXECUTABLE="$HOST_CODEGEN" -DREXGLUE_USE_VULKAN=ON -DREXGLUE_USE_D3D12=OFF -DREXGLUE_ENABLE_TRACY=OFF -DREXGLUE_BUILD_TESTS=OFF

      - name: Compile and link full MCLA native library
        run: |
          set -euo pipefail
          cmake --build "$GITHUB_WORKSPACE/build-android" --target main --parallel 2
          LIB="$(find "$GITHUB_WORKSPACE/build-android" "$GITHUB_WORKSPACE/third_party/rexglue-sdk/out/android-arm64" -type f -name libmain.so -print -quit)"
          test -n "$LIB" && test -s "$LIB" || { echo "libmain.so was not produced"; exit 1; }
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$LIB"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$LIB" | grep NEEDED || true
          mkdir -p native-full-link-results
          cp "$LIB" native-full-link-results/libmain.so
          sha256sum native-full-link-results/libmain.so > native-full-link-results/SHA256SUMS.txt

      - name: Upload native link artifact and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcla-android-full-native-link
          path: |
            native-full-link-results/
            build-android/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7
