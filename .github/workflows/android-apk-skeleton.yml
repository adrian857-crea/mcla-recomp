
name: MCLA Android APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK packages
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager was not found."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android application
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-skeleton/app/src/main/java/com/centralgamer/mcla

          cat > android-skeleton/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MCLAAndroid"
          include(":app")
          EOF

          cat > android-skeleton/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
              id "org.jetbrains.kotlin.android" version "2.0.21" apply false
          }
          EOF

          cat > android-skeleton/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.caching=true
          android.useAndroidX=true
          EOF

          cat > android-skeleton/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
              namespace "com.centralgamer.mcla"
              compileSdk 35

              defaultConfig {
                  applicationId "com.centralgamer.mcla"
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName "0.2.0"

                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }

              buildTypes {
                  debug {
                      applicationIdSuffix ".debug"
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > android-skeleton/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="MCLA Android"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-skeleton/app/src/main/java/com/centralgamer/mcla/MainActivity.kt <<'EOF'
          package com.centralgamer.mcla

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var status: TextView

              companion object {
                  private const val PICK_FOLDER = 1001
                  private const val PICK_FILE = 1002
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(28, 36, 28, 36)
                      setBackgroundColor(Color.rgb(18, 18, 24))
                  }

                  val title = TextView(this).apply {
                      text = "MCLA Android"
                      textSize = 30f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  val description = TextView(this).apply {
                      text = "Selecione os arquivos do seu jogo"
                      textSize = 16f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 20, 0, 20)
                  }

                  status = TextView(this).apply {
                      text = "Nenhuma pasta ou arquivo selecionado."
                      textSize = 14f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 12, 0, 24)
                  }

                  val folderButton = Button(this).apply {
                      text = "Selecionar pasta do jogo"
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE)
                          startActivityForResult(intent, PICK_FOLDER)
                      }
                  }

                  val fileButton = Button(this).apply {
                      text = "Selecionar arquivo ISO / XEX"
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          startActivityForResult(intent, PICK_FILE)
                      }
                  }

                  val note = TextView(this).apply {
                      text = "Atenção: selecionar os arquivos ainda não inicia o jogo. Esta versão testa apenas a seleção."
                      textSize = 13f
                      setTextColor(Color.rgb(255, 190, 100))
                      gravity = Gravity.CENTER
                      setPadding(0, 24, 0, 0)
                  }

                  layout.addView(title)
                  layout.addView(description)
                  layout.addView(status)
                  layout.addView(folderButton)
                  layout.addView(fileButton)
                  layout.addView(note)

                  val scrollView = ScrollView(this)
                  scrollView.addView(layout)
                  setContentView(scrollView)
              }

              @Deprecated("Using onActivityResult for compatibility")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (resultCode != RESULT_OK || data?.data == null) {
                      status.text = "Seleção cancelada. Você pode tentar novamente."
                      return
                  }

                  val uri: Uri = data.data!!

                  when (requestCode) {
                      PICK_FOLDER -> {
                          try {
                              val flags = data.flags and (
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION or
                                  Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                              )

                              contentResolver.takePersistableUriPermission(uri, flags)
                          } catch (_: SecurityException) {
                              // A seleção ainda pode ser exibida nesta sessão.
                          } catch (_: IllegalArgumentException) {
                              // Alguns provedores não oferecem permissão persistente.
                          }

                          status.text = "Pasta selecionada!\n\n$uri\n\nPróximo passo: verificar os arquivos dentro dela."
                      }

                      PICK_FILE -> {
                          val fileName = getFileName(uri)

                          status.text = "Arquivo selecionado!\n\nNome: $fileName\n\nLocalização: $uri\n\nO conteúdo ainda não foi validado."
                      }
                  }
              }

              private fun getFileName(uri: Uri): String {
                  var name = uri.lastPathSegment ?: "Arquivo selecionado"

                  contentResolver.query(
                      uri,
                      arrayOf(OpenableColumns.DISPLAY_NAME),
                      null,
                      null,
                      null
                  )?.use { cursor ->
                      if (cursor.moveToFirst()) {
                          val index = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (index >= 0) {
                              name = cursor.getString(index) ?: name
                          }
                      }
                  }

                  return name
              }
          }
          EOF

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon \
            -p android-skeleton \
            assembleDebug

          APK="android-skeleton/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          echo "APK successfully generated: $APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mcla-android-file-picker-apk
          path: android-skeleton/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
         
