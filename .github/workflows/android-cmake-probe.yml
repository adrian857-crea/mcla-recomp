name: Android CMake configuration probe

'on':
workflow_dispatch:

permissions:
contents: read

jobs:
android-configure:
runs-on: ubuntu-24.04
timeout-minutes: 20

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      submodules: recursive

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: 'platform-tools'

  - name: Install Android NDK and CMake
    run: |
      sdkmanager "ndk;27.2.12479018" "cmake;3.31.6" "platforms;android-35"

      echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

  - name: Test Android CMake configuration
    id: probe
    shell: bash
    run: |
      set +e

      cmake -S . -B build/android-arm64 \
        -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
        -DANDROID_ABI=arm64-v8a \
        -DANDROID_PLATFORM=android-26 \
        -DCMAKE_BUILD_TYPE=Debug \
        -DANDROID_STL=c++_shared 2>&1 | tee android-cmake-probe.log

      result=${PIPESTATUS[0]}
      echo "cmake_exit_code=$result" >> "$GITHUB_OUTPUT"

      if [ "$result" -eq 0 ]; then
        echo "Android CMake configuration succeeded."
      else
        echo "Android CMake configuration failed. See the log artifact."
      fi

  - name: Upload diagnostic log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: android-cmake-probe-log
      path: android-cmake-probe.log
      if-no-files-found: warn

  - name: Summarize result
    if: always()
    env:
      CMAKE_EXIT_CODE: ${{ steps.probe.outputs.cmake_exit_code }}
    run: |
      {
        echo "## Android CMake configuration probe"
        echo ""
        echo "- CMake exit code: ${CMAKE_EXIT_CODE:-unknown}"
        echo "- This is a configuration test, not an APK build."
        echo "- No game data is included or uploaded."
      } >> "$GITHUB_STEP_SUMMARY"
