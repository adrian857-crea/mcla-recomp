name: MCLA Android Entrypoint Real Compile

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-android-entrypoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout MCLA
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git python3 unzip curl

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$RUNNER_TEMP/cmdline-tools"

          curl --http1.1 --retry 5 --retry-all-errors --retry-delay 2 \
            -fSL \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -o "$RUNNER_TEMP/cmdline-tools.zip"

          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" \
            -d "$RUNNER_TEMP/cmdline-tools"

          mkdir -p "$SDK/cmdline-tools/latest"
          mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools/"* \
            "$SDK/cmdline-tools/latest/"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses >/dev/null || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Checkout ReXGlue SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third_party
          git clone --recursive \
            "https://github.com/adrian857-crea/rexglue-sdk.git" \
            third_party/rexglue-sdk

          git -C third_party/rexglue-sdk log -1 --oneline

      - name: Verify source and dependencies
        shell: bash
        run: |
          set -euo pipefail

          SDK="$GITHUB_WORKSPACE/third_party/rexglue-sdk"
          ENTRY="$GITHUB_WORKSPACE/src/android_main.cpp"

          test -f "$ENTRY"
          test -f "$SDK/include/rex/cvar.h"
          test -f "$SDK/include/rex/logging.h"
          test -f "$SDK/include/rex/ui/windowed_app.h"
          test -f "$SDK/include/rex/ui/windowed_app_context_sdl.h"

          echo "=== Android entrypoint ==="
          sed -n '1,180p' "$ENTRY"

          echo "=== fmt header candidates ==="
          find "$SDK" -type f -path "*/fmt/format.h" -print || true

          echo "=== SDL header candidates ==="
          find "$SDK" -type f -path "*/SDL3/SDL.h" -print

      - name: Configure Android FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          SDK="$GITHUB_WORKSPACE/third_party/rexglue-sdk"
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android26-clang"
          test -x "$TOOLCHAIN/aarch64-linux-android26-clang++"

          cd "$SDK/thirdparty/FFmpeg"

          ./configure \
            --arch=aarch64 \
            --cpu=armv8-a \
            --target-os=android \
            --enable-cross-compile \
            --cc="$TOOLCHAIN/aarch64-linux-android26-clang" \
            --cxx="$TOOLCHAIN/aarch64-linux-android26-clang++" \
            --ar="$TOOLCHAIN/llvm-ar" \
            --ranlib="$TOOLCHAIN/llvm-ranlib" \
            --nm="$TOOLCHAIN/llvm-nm" \
            --strip="$TOOLCHAIN/llvm-strip" \
            --disable-x86asm \
            --disable-programs \
            --disable-doc \
            --disable-network \
            --disable-autodetect \
            --disable-everything \
            --enable-avutil \
            --enable-avcodec \
            --disable-shared \
            --enable-static

          test -f config.h

      - name: Patch Android assembly target for CI
        shell: bash
        run: |
          set -euo pipefail

          SDK="$GITHUB_WORKSPACE/third_party/rexglue-sdk"

          python3 - "$SDK/CMakeLists.txt" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()

          old = '"<CMAKE_ASM_COMPILER> <DEFINES> <INCLUDES> <FLAGS> -o <OBJECT> -c <SOURCE>"'
          new = '"<CMAKE_ASM_COMPILER> --target=aarch64-linux-android26 <DEFINES> <INCLUDES> <FLAGS> -o <OBJECT> -c <SOURCE>"'

          if old in source:
              path.write_text(source.replace(old, new, 1))
              print("Assembly command patched.")
          elif new in source:
              print("Assembly command already patched.")
          else:
              raise SystemExit(
                  "Expected assembly command not found in ReXGlue CMakeLists.txt."
              )
          PY

      - name: Configure ReXGlue for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          SDK="$GITHUB_WORKSPACE/third_party/rexglue-sdk"
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          BUILD="$GITHUB_WORKSPACE/native-entrypoint-real-compile/android-sdk"

          cmake -S "$SDK" -B "$BUILD" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_USE_D3D12=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_BUILD_TESTS=OFF

      - name: Build ReXGlue runtime and UI
        shell: bash
        run: |
          set -euo pipefail

          cmake --build \
            "$GITHUB_WORKSPACE/native-entrypoint-real-compile/android-sdk" \
            --target rexruntime rexui \
            --parallel 2

      - name: Discover generated include paths
        shell: bash
        run: |
          set -euo pipefail

          SDK="$GITHUB_WORKSPACE/third_party/rexglue-sdk"
          BUILD="$GITHUB_WORKSPACE/native-entrypoint-real-compile/android-sdk"

          echo "=== fmt headers ==="
          find "$SDK" "$BUILD" \
            -type f -path "*/fmt/format.h" -print || true

          echo "=== SDL headers ==="
          find "$SDK" "$BUILD" \
            -type f -path "*/SDL3/SDL.h" -print

          echo "=== Compilation database ==="
          test -f "$BUILD/compile_commands.json"

          python3 - "$BUILD/compile_commands.json" <<'PY'
          import json
          import pathlib
          import sys

          entries = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("Compilation entries:", len(entries))

          for entry in entries:
              if "windowed_app_context_sdl" in entry.get("file", ""):
                  print("Relevant source:", entry["file"])
                  print("Command:", entry.get("command", entry.get("arguments", [])))
                  break
          PY

      
      - name: Compile Android entrypoint
        shell: bash
        run: |
          set -euo pipefail

          BUILD="$GITHUB_WORKSPACE/native-entrypoint-real-compile/android-sdk"
          ENTRY="$GITHUB_WORKSPACE/src/android_main.cpp"
          OBJECTS="$GITHUB_WORKSPACE/native-entrypoint-real-compile/objects"

          test -f "$ENTRY"
          test -f "$BUILD/compile_commands.json"
          mkdir -p "$OBJECTS"

          python3 - "$BUILD/compile_commands.json" "$ENTRY" "$OBJECTS/android_main.o" <<'PY'
          import json
          import pathlib
          import shlex
          import subprocess
          import sys

          database = pathlib.Path(sys.argv[1])
          source = pathlib.Path(sys.argv[2]).resolve()
          output = pathlib.Path(sys.argv[3]).resolve()
          entries = json.loads(database.read_text())

          candidates = [
              item for item in entries
              if pathlib.Path(item["file"]).name == "windowed_app_context_sdl.cpp"
          ]

          if not candidates:
              raise SystemExit("No suitable Android C++ compile command found.")

          entry = candidates[0]
          command = entry.get("arguments")
          if command is None:
              command = shlex.split(entry["command"])

          compiler = command[0]
          args = command[1:]
          filtered = []
          i = 0

          while i < len(args):
              arg = args[i]

              if arg in ("-o", "-MF", "-MT", "-MQ"):
                  i += 2
                  continue

              if arg in ("-c", "-MD", "-MMD", "-MP", "-Winvalid-pch"):
                  i += 1
                  continue

              if arg == "-Xclang":
                  i += 1
                  if i < len(args) and args[i] == "-include-pch":
                      i += 1
                      if i < len(args) and args[i] == "-Xclang":
                          i += 1
                      if i < len(args):
                          i += 1
                      continue

                  if i < len(args) and args[i] == "-include":
                      i += 1
                      if i < len(args) and args[i] == "-Xclang":
                          i += 1
                      if i < len(args):
                          i += 1
                      continue

                  if i < len(args):
                      filtered.extend(["-Xclang", args[i]])
                      i += 1
                  continue

              if arg.endswith("windowed_app_context_sdl.cpp"):
                  i += 1
                  continue

              filtered.append(arg)
              i += 1

          filtered.extend(["-c", str(source), "-o", str(output)])

          print("Compiler:", compiler)
          print("Compiling Android entrypoint:", source)
          subprocess.run(
              [compiler, *filtered],
              cwd=entry["directory"],
              check=True
          )

          if not output.is_file():
              raise SystemExit("Compiler did not generate the expected object file.")

          print("Object generated:", output)
          PY

          file "$OBJECTS/android_main.o"
          echo "Entrypoint compilation succeeded."


          
      - name: Inspect native link dependencies
        shell: bash
        run: |
          set -euo pipefail

          SDK="$GITHUB_WORKSPACE/third_party/rexglue-sdk"
          BUILD="$GITHUB_WORKSPACE/native-entrypoint-real-compile/android-sdk"
          OBJECT="$GITHUB_WORKSPACE/native-entrypoint-real-compile/objects/android_main.o"

          echo "=== Android entrypoint object ==="
          file "$OBJECT"

          echo "=== ReXGlue output libraries ==="
          find "$SDK/out" "$BUILD" \
            -type f \( -name "*.so" -o -name "*.a" \) \
            -print 2>/dev/null | sort

          echo "=== Undefined symbols in entrypoint ==="
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"

          "$NM" -u -C "$OBJECT" || true

          echo "=== SDL_main symbol ==="
          "$NM" -C "$OBJECT" | grep -E 'SDL_main|main$' || true

          echo "Native link dependency inspection completed."

